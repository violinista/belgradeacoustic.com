<!DOCTYPE html>
<html lang="{{ settings.lang }}">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ settings.site_name }} – {{ settings.tagline }}</title>
    <meta name="description" content="{{ settings.description }}" />

    <meta property="og:title" content="{{ settings.site_name }} – {{ settings.tagline }}" />
    <meta property="og:description" content="{{ settings.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="sr_RS" />

    <link rel="icon" href="{% favicon 'static/img/logo.png', 64 %}" />
    <link rel="stylesheet" type="text/css" href="/static/css/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Overpass:wght@200;300;400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="font-sans text-gray-700 antialiased bg-white">
    {% include "./partials/navbar.html" %}

    <main>{{ content | safe }}</main>

    {% include "./partials/footer.html" %}

    {% if production %}{% include "./partials/analytics.html" %}{% endif %}
  </body>
</html>
