<!-- Cookie banner + Google Analytics. Production builds only. Nothing is
     requested from Google until the visitor clicks "accept". -->
<!-- The toggled element must not carry a display utility (flex, block…):
     Tailwind's utilities would override [hidden] and show it regardless. -->
<div id="kolacici" hidden class="fixed inset-x-0 bottom-0 z-50 bg-gray-900/95 border-t border-white/10 text-white">
  <div class="container mx-auto px-6 py-5 flex flex-col md:flex-row md:items-center gap-4 md:gap-10">
    <p class="text-sm text-white/70 leading-relaxed md:flex-1">{{ kolacici.text }}</p>
    <div class="flex gap-3 shrink-0">
      <button type="button" data-consent="granted"
              class="bg-yellow-600 hover:bg-yellow-500 text-white font-heading uppercase text-xs tracking-widest px-6 py-3 transition-colors">
        {{ kolacici.accept }}
      </button>
      <button type="button" data-consent="denied"
              class="border border-white/25 hover:border-yellow-500 text-white hover:text-yellow-500 font-heading uppercase text-xs tracking-widest px-6 py-3 transition-colors">
        {{ kolacici.decline }}
      </button>
    </div>
  </div>
</div>

<script>
  (function () {
    var id = "{{ settings.google_analytics_id }}";
    var key = "bao-analytics";
    var banner = document.getElementById("kolacici");
    var loaded = false;

    // The standard gtag.js snippet, run on consent instead of in <head>.
    function load() {
      loaded = true;
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag("consent", "default", {
        analytics_storage: "granted",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
      });
      gtag("js", new Date());
      gtag("config", id);

      var script = document.createElement("script");
      script.async = true;
      script.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
      document.head.appendChild(script);

      // Bookings come in by e-mail or phone, so count clicks on those links.
      document.addEventListener("click", function (event) {
        var link = event.target.closest('a[href^="mailto:"], a[href^="tel:"]');
        if (!link) return;
        gtag("event", "contact", {
          method: link.protocol === "mailto:" ? "email" : "phone",
          link_url: link.href,
        });
      });
    }

    // Withdrawn consent: stop GA, drop its cookies and reload without it.
    function unload() {
      gtag("consent", "update", { analytics_storage: "denied" });
      var domain = location.hostname.replace(/^www\./, "");
      document.cookie.split("; ").forEach(function (cookie) {
        var name = cookie.split("=")[0];
        if (name.indexOf("_ga") === 0) {
          document.cookie = name + "=; max-age=0; path=/";
          document.cookie = name + "=; max-age=0; path=/; domain=" + domain;
        }
      });
      location.reload();
    }

    banner.addEventListener("click", function (event) {
      var button = event.target.closest("[data-consent]");
      if (!button) return;
      var choice = button.getAttribute("data-consent");
      try { localStorage.setItem(key, choice); } catch (e) {}
      banner.hidden = true;
      if (choice === "granted" && !loaded) load();
      if (choice === "denied" && loaded) unload();
    });

    var footerLink = document.querySelector("[data-consent-open]");
    footerLink.hidden = false;
    footerLink.addEventListener("click", function () {
      banner.hidden = false;
      banner.querySelector("button").focus();
    });

    var stored = null;
    try { stored = localStorage.getItem(key); } catch (e) {}
    if (stored === "granted") load();
    else if (stored !== "denied") banner.hidden = false;
  })();
</script>
