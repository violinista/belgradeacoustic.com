<footer class="bg-gray-900 text-white">
  <div class="container mx-auto px-6 py-16">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-12 text-center md:text-left">
      <div>
        <div class="font-display text-2xl text-white/90 mb-4">{{ settings.site_name }}</div>
        <p class="text-sm text-white/50 leading-relaxed">{{ settings.tagline }}</p>
      </div>

      <div>
        <div class="font-heading uppercase text-sm tracking-widest text-white/80 mb-5">Kontakt</div>
        <a href="mailto:{{ settings.email }}" class="block mb-3 text-sm text-white/60 hover:text-yellow-500 transition-colors">{{ settings.email }}</a>
        {% for phone in settings.phones %}
          <a href="tel:{{ phone.tel }}" class="block mb-3 text-sm text-white/60 hover:text-yellow-500 transition-colors">
            {{ phone.display }} <span class="text-white/40">{{ phone.name }}</span>
          </a>
        {% endfor %}
      </div>

      <div>
        <div class="font-heading uppercase text-sm tracking-widest text-white/80 mb-5">Pratite nas</div>
        <div class="flex gap-4 justify-center md:justify-start">
          <a href="{{ settings.social.youtube }}" target="_blank" rel="noopener" aria-label="YouTube"
             class="w-11 h-11 flex items-center justify-center border border-white/20 hover:border-yellow-500 hover:text-yellow-500 text-white/70 transition-colors">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z" /></svg>
          </a>
          <a href="{{ settings.social.facebook }}" target="_blank" rel="noopener" aria-label="Facebook"
             class="w-11 h-11 flex items-center justify-center border border-white/20 hover:border-yellow-500 hover:text-yellow-500 text-white/70 transition-colors">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.12 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z" /></svg>
          </a>
        </div>
      </div>
    </div>
  </div>

  <div class="border-t border-white/10">
    <div class="container mx-auto px-6 py-6 text-center font-heading text-xs tracking-widest uppercase text-white/40">
      Copyright &copy; {% year %}. {{ settings.copyright }}
      {% if production %}
        <!-- Reopens the cookie banner; revealed by partials/analytics.html. -->
        <span data-consent-open hidden>
          &middot; <button type="button" class="uppercase tracking-widest hover:text-yellow-500 transition-colors">{{ kolacici.footer_link }}</button>
        </span>
      {% endif %}
    </div>
  </div>
</footer>
