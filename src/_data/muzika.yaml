title: Muzika
hero_image: static/img/hero-muzika.png
intro: >-
  Repertoar benda nije lako definisati: nekada je to klasična muzika i
  evergreen, nekada rock i pop, nekada etno i narodna, nekada je samo strana,
  nekada je samo domaća – sve u zavisnosti od prilike i raspoloženja publike,
  koja nam je uvek na prvom mestu. Ideja koja nas vodi je da muzika ne poznaje
  granice, da je naša misija da činimo ljude srećnim i veselim, da im pomognemo
  da se lepo provedu i da im trenuci provedeni uz nas ostanu lepa uspomena.
