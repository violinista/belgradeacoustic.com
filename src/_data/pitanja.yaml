title: Najčešća Pitanja
items:
  - q: Kako da rezervišemo vaš nastup?
    a: >-
      Naš bend nastupa više od 120 puta godišnje na privatnim zabavama. Zbog
      velike potražnje za slobodnim datumima, uobičajena praksa je da se nastupi
      zakazuju i po nekoliko meseci unapred. Preporučujemo Vam da nas
      kontaktirate kako biste saznali naš raspored nastupa i angažovali nas za
      željeni termin.
  - q: Da li nastupate van Beograda ili u inostranstvu?
    a: >-
      Naravno! To što nosimo ime “Beogradski Akustični Orkestar” ne znači da
      nastupamo samo u Beogradu. 🙂 Redovno putujemo, ne samo po Srbiji, već i
      po celoj Evropi, a dogodi se da završimo i na nekoj od egzotičnih
      destinacija. Posedujemo licence, ATA Karnet za opremu i ostalu neophodnu
      dokumentaciju.
  - q: Ako niste slobodni u željenom terminu, da li postoji mogućnost da se to promeni?
    a: >-
      Unapred dogovoreni termin se poštuje i nije ga moguće pomeriti ili
      otkazati zbog neke druge proslave. Preporučujemo da nas na vreme
      kontaktirate i saznate naše raspoložive termine kako biste nas rezervisali
      za Vaš željeni dogadjaj.
  - q: Da li nastupate sa ozvučenjem?
    a: >-
      Orkestar poseduje svoje ozvučenje koje je dovoljno za prostore koji
      primaju do 1.000 ljudi. Naši tehničari dolaze nekoliko sati pre nastupa
      kako bi pripremili binu, postavili ozvučenje i podesili zvuk.
  - q: Zašto da izaberemo baš vas?
    a: >-
      Zbog toga što imamo petnaest godina iskustva, preko 2.000 nastupa,
      proslava i odsviranih koncerata. Naš sastav je nepromenjen od osnivanja, a
      akustični instrumenti i ubedljivi vokali pružaju nam slobodu da stvorimo
      sopstveni muzički izraz i atmosferu koja se prepričava. Dogovoru saradnje
      pristupamo baš kao i sviranju – profesionalno.
  - q: Odlučili ste se za nas ili imate još nekih pitanja?
    a: Kontaktirajte nas — rado ćemo odgovoriti na sva vaša pitanja.
